[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "yallm"
version = "0.1.0"
description = "Unified LLM API converter - proxy server"
authors = [{ name = "Tang Ziya", email = "tcztzy@gmail.com" }]
requires-python = ">=3.9"
keywords = ["llm", "openai", "anthropic", "ollama", "proxy", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"

[project.urls]
Repository = "https://github.com/tcztzy/yallm"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/yallm/Cargo.toml"
module-name = "yallm"
python-source = "python"
strip = true

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "anthropic>=0.77.1",
    "ollama>=0.6.1",
    "openai>=2.16.0",
]
