# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Vendored OpenAPI specs are generated artifacts (large, machine-written);
# skip whitespace/size linting for them.
exclude: 'crates/yallm-(openai|anthropic)/openapi(\.documented)?\.yml$'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
    -   id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
    -   id: cargo-doc
        name: cargo doc (rustdoc lints)
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
    -   id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
    -   id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
