[workspace]
members = ["crates/*"]
resolver = "2"

# Inherited by every crate via `[lints] workspace = true`.
# These rustdoc lints only fire during `cargo doc`, not `cargo build`/clippy —
# run `RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps` to check.
[workspace.lints.rustdoc]
broken-intra-doc-links = "warn"
missing-crate-level-docs = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tang Ziya <tcztzy@gmail.com>"]
license = "MIT"
repository = "https://github.com/tcztzy/yallm"
publish = ["crates-io"]

[workspace.dependencies]
# Internal crates
yallm-ir = { version = "0.1.0", path = "crates/yallm-ir" }
yallm-acp = { version = "0.1.0", path = "crates/yallm-acp" }
yallm-cli = { version = "0.1.0", path = "crates/yallm-cli" }
yallm-server = { version = "0.1.0", path = "crates/yallm-server" }
yallm-openai = { version = "0.1.0", path = "crates/yallm-openai" }
yallm-anthropic = { version = "0.1.0", path = "crates/yallm-anthropic" }
yallm-ollama = { version = "0.1.0", path = "crates/yallm-ollama" }
yallm-macros = { version = "0.1.0", path = "crates/yallm-macros" }
yallm-responses = { version = "0.1.0", path = "crates/yallm-responses" }
yallm-storage = { version = "0.1.0", path = "crates/yallm-storage" }
yallm-config = { version = "0.1.0", path = "crates/yallm-config" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (axum)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
futures = "0.3"
bytes = "1"
