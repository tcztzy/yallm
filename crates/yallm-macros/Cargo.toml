[package]
name = "yallm-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Procedural macros for yallm"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
reqwest-middleware = "0.4"
http-cache-reqwest = { version = "0.15", default-features = false, features = ["manager-cacache"] }
typify = "0.5"
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
dirs = "6"

[lints]
workspace = true
